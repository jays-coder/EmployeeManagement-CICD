
name: .NET 8 CI/CD - EmployeeManagement

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]

    steps:
      # 1. Download source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Verify the installed .NET 8 SDK
      - name: Verify .NET SDK
        shell: powershell
        run: |
          dotnet --list-sdks

          $sdk = dotnet --list-sdks |
            Select-String '^8\.'

          if (-not $sdk) {
            throw ".NET 8 SDK is not installed or unavailable to the runner."
          }

      # 3. Restore NuGet packages
      - name: Restore dependencies
        run: dotnet restore EmployeeManagement/EmployeeManagement.csproj

      # 4. Build the application
      - name: Build application
        run: dotnet build EmployeeManagement/EmployeeManagement.csproj --configuration Release --no-restore

      # 5. Run tests
      - name: Run tests
        run: dotnet test EmployeeManagement/EmployeeManagement.csproj --configuration Release --no-build

      # 6. Publish the application
      - name: Publish application
        run: dotnet publish EmployeeManagement/EmployeeManagement.csproj --configuration Release --no-build --output "${{ github.workspace }}\publish"

      # 7. Upload the build artifact
      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: employee-management-app
          path: ./publish/
          if-no-files-found: error

      # 8. Deploy to local IIS after pushes to main
      - name: Deploy to local IIS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $env:GITHUB_WORKSPACE 'publish'
          $destination = 'C:\inetpub\EmployeeManagement'

          if (-not (Test-Path $source)) {
            throw "Publish folder not found: $source"
          }

          if (-not (Test-Path (Join-Path $source 'web.config'))) {
            throw "web.config not found. Ensure ASP.NET Core publish output is correct."
          }

          if (-not (Test-Path $destination)) {
            New-Item -ItemType Directory -Path $destination -Force |
              Out-Null
          }

          $offlineFile = Join-Path $destination 'app_offline.htm'

          Set-Content -Path $offlineFile `
            -Value 'Application deployment in progress.' `
            -Encoding UTF8

          Start-Sleep -Seconds 5

          robocopy $source $destination /MIR /R:2 /W:2 /XF app_offline.htm

          if ($LASTEXITCODE -ge 8) {
            throw "Deployment copy failed. Robocopy exit code: $LASTEXITCODE"
          }

          Remove-Item $offlineFile -Force

          Write-Host "Deployment completed successfully."
