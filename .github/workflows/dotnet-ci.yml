
name: .NET CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify .NET SDK
        shell: powershell
        run: |
          dotnet --list-sdks
          if (-not (dotnet --list-sdks | Select-String '^8\.')) {
            Write-Error ".NET 8 SDK is not available to the runner."
            exit 1
          }

      - name: Restore dependencies
        run: dotnet restore EmployeeManagement/EmployeeManagement.csproj

      - name: Build application
        run: dotnet build EmployeeManagement/EmployeeManagement.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test EmployeeManagement/EmployeeManagement.csproj --configuration Release --no-build

      - name: Publish application
        run: dotnet publish EmployeeManagement/EmployeeManagement.csproj --configuration Release --no-build --output "${{ github.workspace }}\publish"

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: employee-management-app
          path: ./publish/
          if-no-files-found: error
