            throw "web.config not found. Check the ASP.NET Core publish output."
          }

          New-Item -ItemType Directory -Path $destination -Force | Out-Null

          $offlineFile = Join-Path $destination 'app_offline.htm'

      - name: Verify .NET SDK
        shell: powershell
        run: |
          dotnet --list-sdks
          if (-not (dotnet --list-sdks | Select-String '^8\.')) {
            Write-Error ".NET 8 SDK is not available to the runner."
            exit 1
          }

          Start-Sleep -Seconds 5

          robocopy $source $destination /MIR /R:2 /W:2 /XF app_offline.htm

          if ($LASTEXITCODE -ge 8) {
            throw "Robocopy failed with exit code $LASTEXITCODE. Check deployment permissions and logs."
          }

      - name: Publish application
        run: dotnet publish EmployeeManagement/EmployeeManagement.csproj --configuration Release --no-build --output "${{ github.workspace }}\publish"

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: employee-management-app
          path: ./publish/
          if-no-files-found: error
          
      - name: Deploy to local IIS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $env:GITHUB_WORKSPACE 'publish'
          $destination = 'C:\inetpub\EmployeeManagement'

          if (-not (Test-Path $source)) {
            throw "Publish folder not found: $source"
          }

          if (-not (Test-Path (Join-Path $source 'web.config'))) {
            throw "web.config not found. Check the ASP.NET Core publish output."
          }

          New-Item -ItemType Directory -Path $destination -Force | Out-Null

          $offlineFile = Join-Path $destination 'app_offline.htm'

          Set-Content -Path $offlineFile `
            -Value 'Application deployment in progress. Please retry shortly.' `
            -Encoding UTF8

          Start-Sleep -Seconds 5

          robocopy $source $destination /MIR /R:2 /W:2 /XF app_offline.htm

          if ($LASTEXITCODE -ge 8) {
            throw "Robocopy failed with exit code $LASTEXITCODE. Check deployment permissions and logs."
          }

          Remove-Item $offlineFile -Force

          Write-Host 'Deployment completed successfully.'

