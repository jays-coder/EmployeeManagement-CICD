
name: .NET CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore EmployeeManagement/EmployeeManagement.csproj

      - name: Build application
        run: dotnet build EmployeeManagement/EmployeeManagement.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test EmployeeManagement/EmployeeManagement.csproj --configuration Release --no-build

      - name: Publish application
        run: dotnet publish EmployeeManagement/EmployeeManagement.csproj --configuration Release --no-build --output ./publish

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: employee-management-app
          path: ./publish